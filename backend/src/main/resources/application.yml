server:
  port: 8080

spring:
  jackson:
    time-zone: Asia/Shanghai
  # 自动加载同目录下的 application-local.yml（本地开发配置，已被 .gitignore 忽略）；
  # 文件不存在时忽略，无需激活 local profile。
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/dormitory?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 首次运行后改为 never，避免重复执行
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dormitory.model
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:change-me-in-local-config}
  expiration: 604800000

app:
  init-admin:
    enabled: ${INIT_ADMIN:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
